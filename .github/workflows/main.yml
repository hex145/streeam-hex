name: Windows - RustDesk

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360  # 6 hours

    steps:
      - name: Run Downloads.bat (if exists)
        shell: cmd
        run: |
          if exist Downloads.bat (
            echo Running Downloads.bat...
            call Downloads.bat
          ) else (
            echo Skipping Downloads.bat (file not found)
          )

      - name: Run show.bat (AnyDesk Login)
        shell: cmd
        run: |
          if exist show.bat (
            echo Running show.bat...
            call show.bat
          ) else (
            echo Skipping show.bat (file not found)
          )

      - name: Timer & Keep-Alive (6 hours)
        shell: powershell
        run: |
          $startTime = Get-Date
          $endTime = $startTime.AddHours(6)
          Write-Host "Timer started at $startTime"
          while ((Get-Date) -lt $endTime) {
            $elapsed = (Get-Date) - $startTime
            Write-Host "Elapsed time: $($elapsed.Hours)h $($elapsed.Minutes)m $($elapsed.Seconds)s - Still running..."
            Start-Sleep -Seconds 300  # Sleep 5 minutes
          }
          Write-Host "Timer completed at $(Get-Date)"
