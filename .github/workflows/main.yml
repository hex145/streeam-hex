name: Windows - RustDesk

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360  # 6 hours

    steps:
      - name: Prepare state folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ./state
          Set-Content -Path ./state/info.txt -Value "Build started at $(Get-Date)"

      - name: Download Essentials from Dropbox
        shell: powershell
        run: |
          $url = "https://www.dropbox.com/scl/fi/qdyd4p9t6xoabl95n5o3g/Downloads.bat?rlkey=snr74vv1vr8k5suujugvrhjtm&dl=1"
          $output = "Downloads.bat"
          Invoke-WebRequest -Uri $url -OutFile $output
          if (!(Test-Path $output)) {
            Write-Error "Downloads.bat not downloaded!"
            exit 1
          } else {
            Write-Host "Downloaded Downloads.bat successfully."
          }

      - name: Run Downloads.bat
        shell: cmd
        run: |
          if exist Downloads.bat (
            call Downloads.bat
          ) else (
            echo Downloads.bat is missing!
            exit /b 1
          )

      - name: Run show.bat (AnyDesk Login)
        shell: cmd
        run: |
          if exist show.bat (
            call show.bat
          ) else (
            echo show.bat not found!
            exit /b 1
          )

      - name: Save state (Artifact)
        uses: actions/upload-artifact@v3
        with:
          name: workflow-state
          path: ./state

      - name: Timer & Keep-Alive (6 hours)
        shell: powershell
        run: |
          $startTime = Get-Date
          $endTime = $startTime.AddHours(6)
          Write-Host "Timer started at $startTime"
          while ((Get-Date) -lt $endTime) {
            $elapsed = (Get-Date) - $startTime
            Write-Host "Elapsed: $($elapsed.Hours)h $($elapsed.Minutes)m $($elapsed.Seconds)s - Still alive"
            Start-Sleep -Seconds 300
          }
          Write-Host "Timer completed at $(Get-Date)"

  resume:
    name: Resume Work from Saved State
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download state (Artifact)
        uses: actions/download-artifact@v3
        with:
          name: workflow-state
          path: ./state

      - name: Continue work from saved state
        shell: powershell
        run: |
          Write-Host "Resuming work from saved state..."
          Get-Content ./state/info.txt

      - name: Continue process after resuming
        shell: cmd
        run: |
          echo "Process completed after resuming"
