name: Windows - RustDesk

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360  # 6 hours

    steps:
      - name: Download Essentials from Dropbox
        shell: powershell
        run: |
          $url = "https://www.dropbox.com/scl/fi/qdyd4p9t6xoabl95n5o3g/Downloads.bat?rlkey=snr74vv1vr8k5suujugvrhjtm&dl=1"
          $output = "Downloads.bat"
          Invoke-WebRequest -Uri $url -OutFile $output
          if (!(Test-Path $output)) {
            Write-Error "Downloads.bat not downloaded!"
            exit 1
          } else {
            Write-Host "Downloaded Downloads.bat successfully."
          }

      - name: Run Downloads.bat
        shell: cmd
        run: |
          if exist Downloads.bat (
            call Downloads.bat
          ) else (
            echo Downloads.bat is missing!
            exit /b 1
          )

      - name: Run show.bat (AnyDesk Login)
        shell: cmd
        run: |
          if exist show.bat (
            call show.bat
          ) else (
            echo show.bat not found!
            exit /b 1
          )

      - name: Timer & Keep-Alive (6 hours)
        shell: powershell
        run: |
          $startTime = Get-Date
          $endTime = $startTime.AddHours(6)
          Write-Host "Timer started at $startTime"
          while ((Get-Date) -lt $endTime) {
            $elapsed = (Get-Date) - $startTime
            Write-Host "Elapsed time: $($elapsed.Hours)h $($elapsed.Minutes)m $($elapsed.Seconds)s - Still running..."
            Start-Sleep -Seconds 300  # Sleep 5 minutes
          }
          Write-Host "Timer completed at $(Get-Date)"
