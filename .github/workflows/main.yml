name: Windows - RustDesk

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360  # 6 hours

    steps:
      # تحميل Essentials من Dropbox
      - name: Download Essentials from Dropbox
        shell: powershell
        run: |
          $url = "https://www.dropbox.com/scl/fi/qdyd4p9t6xoabl95n5o3g/Downloads.bat?rlkey=snr74vv1vr8k5suujugvrhjtm&dl=1"
          $output = "Downloads.bat"
          Invoke-WebRequest -Uri $url -OutFile $output
          if (!(Test-Path $output)) {
            Write-Error "Downloads.bat not downloaded!"
            exit 1
          } else {
            Write-Host "Downloaded Downloads.bat successfully."
          }

      # تشغيل Downloads.bat
      - name: Run Downloads.bat
        shell: cmd
        run: |
          if exist Downloads.bat (
            call Downloads.bat
          ) else (
            echo Downloads.bat is missing!
            exit /b 1
          )

      # تشغيل show.bat (AnyDesk Login)
      - name: Run show.bat (AnyDesk Login)
        shell: cmd
        run: |
          if exist show.bat (
            call show.bat
          ) else (
            echo show.bat not found!
            exit /b 1
          )

      # حفظ الحالة (أو بيانات العملية) في Artifact
      - name: Save state (Artifact)
        uses: actions/upload-artifact@v3
        with:
          name: workflow-state
          path: ./state  # حفظ الملفات أو البيانات المهمة هنا

      # Timer & Keep-Alive (6 ساعات)
      - name: Timer & Keep-Alive (6 hours)
        shell: powershell
        run: |
          $startTime = Get-Date
          $endTime = $startTime.AddHours(6)
          Write-Host "Timer started at $startTime"
          while ((Get-Date) -lt $endTime) {
            $elapsed = (Get-Date) - $startTime
            Write-Host "Elapsed time: $($elapsed.Hours)h $($elapsed.Minutes)m $($elapsed.Seconds)s - Still running..."
            Start-Sleep -Seconds 300  # Sleep 5 minutes
          }
          Write-Host "Timer completed at $(Get-Date)"

  # خطوة جديدة لاستئناف العمل عند إعادة تشغيل الـ workflow
  resume:
    name: Resume Work from Saved State
    runs-on: windows-latest
    needs: build  # هذا يضمن أن هذه الخطوة تأتي بعد خطوة البناء

    steps:
      # تنزيل Artifact لاستئناف العمل
      - name: Download state (Artifact) to resume work
        uses: actions/download-artifact@v3
        with:
          name: workflow-state
          path: ./state  # تنزيل ملفات الحالة التي تم حفظها سابقًا

      # استئناف العمل باستخدام البيانات المحفوظة
      - name: Continue work from saved state
        shell: powershell
        run: |
          Write-Host "Resuming work from saved state..."
          # يمكنك استئناف المهام بناءً على البيانات المحفوظة في الـ Artifact
          # على سبيل المثال، يمكن استخدام الملفات المحفوظة لاستكمال العمليات أو استئناف التحميل
          # أكمل تنفيذ العمليات هنا باستخدام الملفات المحفوظة
          
      # إكمال العملية بعد استئناف العمل
      - name: Continue process after resuming
        shell: cmd
        run: |
          echo "Process completed after resuming"
          # أضف هنا بقية العمليات التي تحتاج إلى استئنافها بعد تحميل البيانات
